<!-- MHH | GHL form header · today-only offer with a live countdown.
     Paste this whole block into the Custom HTML element at the top of the GHL form (replaces the previous header).
     The countdown runs to midnight Dubai time (UTC+04:00), the same day boundary the daily TAM… codes use. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<div class="mhh-offer-form-head mhh-offer-form-head--play" dir="rtl" lang="ar">
  <div class="mhh-offer-form-head__gift" aria-hidden="true">
    <span class="mhh-offer-form-head__glow"></span>
    <span class="mhh-offer-form-head__box"></span>
    <span class="mhh-offer-form-head__lid">
      <i class="mhh-offer-form-head__bow mhh-offer-form-head__bow--left"></i>
      <i class="mhh-offer-form-head__bow mhh-offer-form-head__bow--right"></i>
    </span>
    <strong class="mhh-offer-form-head__badge" dir="ltr">20%</strong>
    <span class="mhh-offer-form-head__spark mhh-offer-form-head__spark--one">✦</span>
    <span class="mhh-offer-form-head__spark mhh-offer-form-head__spark--two">✦</span>
  </div>

  <h2>جهزنا لك خصم إضافي <span dir="ltr">20%</span></h2>

  <!-- Urgency strip: live countdown to the end of today. -->
  <div class="mhh-offer-form-head__urgent" role="timer" aria-label="الوقت المتبقي على انتهاء العرض">
    <div class="mhh-offer-form-head__urgent-copy">
      <i aria-hidden="true"></i>
      <span><strong>عرض النهارده بس</strong>بينتهي خلال</span>
    </div>
    <div class="mhh-offer-form-head__clock" dir="ltr">
      <span><b data-mhh-h>00</b><small>ساعة</small></span>
      <em aria-hidden="true">:</em>
      <span><b data-mhh-m>00</b><small>دقيقة</small></span>
      <em aria-hidden="true">:</em>
      <span><b data-mhh-s>00</b><small>ثانية</small></span>
    </div>
    <div class="mhh-offer-form-head__track" aria-hidden="true"><span data-mhh-bar></span></div>
  </div>

  <p>سجّل بياناتك واستلم كود الخصم فورًا — <strong>الكود بيتلغي الساعة 12 بالليل ومش هيتكرر</strong></p>
</div>

<style>
/* Keep the form font without changing unrelated page controls. */
#_builder-form,
#_builder-form *,
.form-builder,
.form-builder *,
.form-builder--wrap,
.form-builder--wrap * {
  font-family: "Tajawal", Arial, sans-serif !important;
}

.mhh-offer-form-head,
.mhh-offer-form-head *,
.mhh-offer-form-head *::before,
.mhh-offer-form-head *::after {
  box-sizing: border-box;
}

.mhh-offer-form-head {
  position: relative;
  isolation: isolate;
  width: 100%;
  margin: 0 auto 14px;
  padding: 12px 14px 14px;
  overflow: hidden;
  border: 1px solid rgba(142, 201, 196, .4);
  border-radius: 18px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(142, 201, 196, .2), transparent 64%),
    linear-gradient(180deg, #ffffff, #f6fbfa);
  box-shadow: inset 0 1px 0 #ffffff, 0 4px 14px rgba(53, 72, 89, .035);
  color: #354859;
  text-align: center;
  font-family: "Tajawal", Arial, sans-serif;
}

.mhh-offer-form-head::before {
  content: "";
  position: absolute;
  top: 0;
  right: 18%;
  left: 18%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #8ec9c4, transparent);
}

/* The gift is drawn in CSS: no image downloads or animation libraries. */
.mhh-offer-form-head__gift {
  position: relative;
  width: 84px;
  height: 70px;
  margin: 0 auto 2px;
  direction: ltr;
  pointer-events: none;
}

.mhh-offer-form-head__glow {
  position: absolute;
  inset: -8px -12px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(142, 201, 196, .32), transparent 68%);
}

.mhh-offer-form-head__box {
  position: absolute;
  top: 34px;
  left: 18px;
  width: 48px;
  height: 33px;
  overflow: hidden;
  border: 1px solid rgba(74, 133, 127, .12);
  border-radius: 4px 4px 8px 8px;
  background: linear-gradient(135deg, #acdcd7, #8ec9c4 62%, #7ab9b3);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), 0 7px 12px rgba(53, 72, 89, .13);
}

.mhh-offer-form-head__box::before,
.mhh-offer-form-head__lid::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: calc(50% - 4px);
  width: 8px;
  background: linear-gradient(90deg, #f2faf9, #ffffff, #e5f4f2);
}

.mhh-offer-form-head__box::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 25%, rgba(255, 255, 255, .65) 48%, transparent 72%);
  transform: translateX(-125%);
}

.mhh-offer-form-head__lid {
  position: absolute;
  z-index: 2;
  top: 27px;
  left: 14px;
  width: 56px;
  height: 12px;
  border: 1px solid rgba(74, 133, 127, .1);

  background: linear-gradient(135deg, #c2e6e2, #9ed3cd);

.mhh-offer-form-head__bow {

.mhh-offer-form-head__bow--left {

.mhh-offer-form-head__bow--right {

  transform: rotate(-13deg);
}

.mhh-offer-form-head__badge {
  position: absolute;
  z-index: 3;
  top: 0;
  left: -1px;
  display: grid;
  place-items: center;
  width: 33px;
  height: 33px;
  border: 2px solid #ffffff;
  border-radius: 50%;
  background: #e03128;
  box-shadow: 0 5px 12px rgba(224, 49, 40, .18);

  font-family: Arial, sans-serif !important;
  font-size: 10px;

  font-weight: 900;
  transform: rotate(-8deg);
}

.mhh-offer-form-head__spark {
  position: absolute;
  z-index: 3;
  color: #b89451;
  font-family: Arial, sans-serif !important;

  opacity: .7;
}

.mhh-offer-form-head__spark--one { top: 11px; right: 1px; font-size: 13px; }
.mhh-offer-form-head__spark--two { bottom: 10px; right: 4px; font-size: 8px; color: #69aaa4; }

.mhh-offer-form-head h2 {
  margin: 0;
  color: #1f303d;
  font-size: 30px;
  line-height: 1.35;
  font-weight: 900;
}

.mhh-offer-form-head h2 > span {
  display: inline-block;
  margin-inline-start: 3px;
  color: #ff3b30;
  white-space: nowrap;
  unicode-bidi: isolate;
}

/* ---------- Urgency strip ---------- */
.mhh-offer-form-head__urgent {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 10px 0 0;
  padding: 9px 12px 13px;
  overflow: hidden;
  border: 1px solid #ffc2b8;
  border-radius: 14px;
  background: linear-gradient(135deg, #fff5f2, #ffe9e4);
  box-shadow: 0 6px 16px rgba(255, 59, 48, .08);
}

.mhh-offer-form-head__urgent-copy {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  color: #9c3a31;
  font-size: 13px;
  line-height: 1.4;
  font-weight: 700;
  text-align: right;
}

.mhh-offer-form-head__urgent-copy strong {
  display: block;
  color: #d0271e;
  font-size: 15px;
  font-weight: 900;
}

.mhh-offer-form-head__urgent-copy > i {
  flex: 0 0 9px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #ff3b30;
  animation: mhhUrgentPulse 1.4s infinite;
}

.mhh-offer-form-head__clock {
  display: flex;
  align-items: flex-start;
  gap: 3px;
  flex-shrink: 0;
}

.mhh-offer-form-head__clock > span {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 44px;
  padding: 4px 2px 3px;
  border-radius: 9px;
  background: linear-gradient(145deg, #ff4b41, #d92d27);
  box-shadow: 0 4px 10px rgba(217, 45, 39, .22);
}

.mhh-offer-form-head__clock b {
  color: #ffffff;
  font: 900 22px/1 Arial, sans-serif !important;
  font-variant-numeric: tabular-nums;
}

.mhh-offer-form-head__clock small {
  margin-top: 2px;
  color: #ffe3df;
  font-size: 9px;
  line-height: 1.2;
  font-weight: 700;
}

.mhh-offer-form-head__clock > em {
  margin-top: 3px;
  color: #e2463d;
  font: 900 19px/1 Arial, sans-serif !important;
  font-style: normal;
  animation: mhhColon 1s steps(1) infinite;
}

/* Thin bar showing how much of today is left. */
.mhh-offer-form-head__track {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 4px;
  background: rgba(255, 59, 48, .12);
}

.mhh-offer-form-head__track > span {
  position: absolute;
  top: 0;
  right: 0;
  height: 100%;
  width: 100%;
  border-radius: 999px 0 0 999px;
  background: linear-gradient(90deg, #ff3b30, #ff7a6b);
  transition: width 1s linear;
}

/* Last 3 hours of the day: the clock pulses. */
.mhh-offer-form-head__urgent.is-urgent .mhh-offer-form-head__clock > span {
  animation: mhhClockUrgent 1s ease-in-out infinite;
}

.mhh-offer-form-head > p {
  max-width: 440px;
  margin: 9px auto 0;
  color: #5d707b;
  font-size: 13px;
  line-height: 1.65;
  font-weight: 600;
}

.mhh-offer-form-head > p strong {
  color: #c42d24;
  font-weight: 800;
}

/* Short entrance sequence, followed by a gentle loop on the stars only. */
.mhh-offer-form-head--play .mhh-offer-form-head__gift { animation: mhhPremiumGiftIn .65s ease-out both; }
.mhh-offer-form-head--play .mhh-offer-form-head__lid { animation: mhhPremiumLid 1.1s .2s ease-in-out both; }
.mhh-offer-form-head--play .mhh-offer-form-head__badge { animation: mhhPremiumBadge .65s .55s cubic-bezier(.22, 1, .36, 1) both; }
.mhh-offer-form-head--play .mhh-offer-form-head__box::after { animation: mhhPremiumShine 1s 1.1s ease-in-out both; }
.mhh-offer-form-head--play .mhh-offer-form-head__urgent { animation: mhhUrgentIn .5s .35s cubic-bezier(.2, .9, .2, 1.2) both; }
.mhh-offer-form-head--play .mhh-offer-form-head__spark {
  animation:
    mhhPremiumSpark 1.1s .45s ease-in-out both,
    mhhPremiumTwinkle 3.4s 1.55s ease-in-out infinite;
}
.mhh-offer-form-head--play .mhh-offer-form-head__spark--two {
  animation-delay: .65s, 1.75s;
  animation-duration: 1.1s, 4.2s;
}

@keyframes mhhPremiumGiftIn {
  from { opacity: 0; transform: translateY(7px) scale(.94); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes mhhPremiumLid {
  0%, 15% { transform: translateY(0) rotate(0); }
  65% { transform: translateY(-10px) rotate(-8deg); }
  100% { transform: translateY(-6px) rotate(-5deg); }
}
@keyframes mhhPremiumBadge {
  from { opacity: 0; transform: translateY(5px) scale(.65) rotate(-18deg); }
  to { opacity: 1; transform: translateY(0) scale(1) rotate(-8deg); }
}
@keyframes mhhPremiumShine {
  from { transform: translateX(-125%); }
  to { transform: translateX(125%); }
}
@keyframes mhhPremiumSpark {
  0% { opacity: 0; transform: scale(.6) rotate(-15deg); }
  55% { opacity: 1; transform: scale(1.12) rotate(10deg); }
  100% { opacity: .7; transform: scale(1) rotate(0); }
}
@keyframes mhhPremiumTwinkle {
  0%, 100% { opacity: .7; transform: scale(1) rotate(0); }
  50% { opacity: 1; transform: scale(1.2) rotate(10deg); }
}
@keyframes mhhUrgentIn {
  from { opacity: 0; transform: translateY(6px) scale(.97); }
  to { opacity: 1; transform: none; }
}
@keyframes mhhUrgentPulse {
  0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, .5); }
  75%, 100% { box-shadow: 0 0 0 8px rgba(255, 59, 48, 0); }
}
@keyframes mhhColon { 50% { opacity: .25; } }
@keyframes mhhClockUrgent {
  50% { box-shadow: 0 0 0 4px rgba(255, 59, 48, .18), 0 4px 10px rgba(217, 45, 39, .3); }
}

/* Apply the original form spacing only inside an iframe. */
html.mhh-offer-iframe,
html.mhh-offer-iframe body {

  max-width: 100% !important;
  margin: 0 !important;

@media (max-width: 600px) {
  .mhh-offer-form-head { margin-bottom: 12px; padding: 10px 10px 12px; border-radius: 16px; }
  .mhh-offer-form-head__gift { transform: scale(.88); margin-bottom: -2px; }
  .mhh-offer-form-head h2 { font-size: clamp(22px, 5.6vw, 27px); }
  .mhh-offer-form-head__urgent { gap: 6px; padding: 8px 9px 12px; }

}

@media (max-width: 360px) {
  .mhh-offer-form-head__urgent { flex-direction: column; }
  .mhh-offer-form-head__urgent-copy { justify-content: center; text-align: center; }
}

@media (prefers-reduced-motion: reduce) {
  .mhh-offer-form-head *,
  .mhh-offer-form-head *::before,
  .mhh-offer-form-head *::after { animation: none !important; transition: none !important; }
}
</style>

<script>
(function () {
  /* Same day boundary as the daily coupon codes: midnight Dubai time (UTC+04:00, no DST). */
  var TZ_OFFSET_HOURS = 4;
  var URGENT_UNDER_HOURS = 3;
  var DAY = 86400000;

  /* Never change the parent sales page's body padding. */
  if (window.self !== window.top) {
    document.documentElement.classList.add('mhh-offer-iframe');
  }

  var pad = function (n) { return String(n).padStart(2, '0'); };

  document.querySelectorAll('.mhh-offer-form-head').forEach(function (header) {
    if (header.dataset.mhhMotionReady) return;
    header.dataset.mhhMotionReady = 'true';

    /* Live countdown to the end of today. */
    var urgent = header.querySelector('.mhh-offer-form-head__urgent');
    var h = header.querySelector('[data-mhh-h]');
    var m = header.querySelector('[data-mhh-m]');
    var s = header.querySelector('[data-mhh-s]');
    var bar = header.querySelector('[data-mhh-bar]');

    function tick() {
      var local = Date.now() + TZ_OFFSET_HOURS * 3600000;
      var left = DAY - (local % DAY);
      var t = Math.max(0, Math.floor(left / 1000));
      h.textContent = pad(Math.floor(t / 3600));
      m.textContent = pad(Math.floor(t % 3600 / 60));
      s.textContent = pad(t % 60);
      bar.style.width = (left / DAY * 100).toFixed(2) + '%';
      urgent.classList.toggle('is-urgent', left <= URGENT_UNDER_HOURS * 3600000);
    }
    tick();
    setInterval(tick, 1000);

    /* Replay the entrance when the header becomes visible; no form data is accessed. */
    if (!('IntersectionObserver' in window)) return;
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        header.classList.toggle('mhh-offer-form-head--play', entry.isIntersecting);
      });
    }, { threshold: 0 });
    observer.observe(header);
  });
})();
</script>
