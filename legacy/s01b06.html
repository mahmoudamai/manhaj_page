<!-- =========================================================
     MHH MANHAJ | PURCHASE TRUST
     OPEN SOCIAL PROOF + LIGHT TRUST ROW
     CLEAN VERSION - NO DIVIDER
========================================================= -->

<link
  href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
>

<style>

#mhhm-purchaseTrust{

  --petrol:#1E5960;
  --petrol-deep:#123C42;
  --navy:#354859;

  --sage:#A7BCA6;
  --sage-soft:#DDE8DC;

  --teal:#8EC9C4;

  --gold:#D3B267;

  --ivory:#FBF7EF;
  --paper:#FFFDF8;

  --text:#5D6A70;
  --muted:#758187;

  width:100%;

  direction:rtl;

  font-family:
    "Tajawal",
    Arial,
    sans-serif !important;

  position:relative;

  padding:
    10px 16px 29px;

  background:
    transparent !important;
}


#mhhm-purchaseTrust *,
#mhhm-purchaseTrust *::before,
#mhhm-purchaseTrust *::after{
  box-sizing:border-box;
}


/* =========================================================
   WRAPPER
========================================================= */

#mhhm-purchaseTrust .wrap{

  width:100%;

  max-width:850px;

  margin:0 auto;

  text-align:center;

  opacity:0;

  transform:
    translateY(13px);

  transition:
    opacity .65s ease,
    transform .65s
    cubic-bezier(.2,.72,.2,1);
}


#mhhm-purchaseTrust .wrap.visible{

  opacity:1;

  transform:
    translateY(0);
}


/* =========================================================
   SOCIAL PROOF
========================================================= */

#mhhm-purchaseTrust .proof{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:13px;

  width:fit-content;

  max-width:100%;

  margin:0 auto;
}


/* =========================================================
   AVATARS
========================================================= */

#mhhm-purchaseTrust .avatars{

  display:flex;

  align-items:center;

  direction:rtl;

  flex:0 0 auto;
}


#mhhm-purchaseTrust .avatars span{

  width:36px;
  height:36px;

  flex:
    0 0 36px;

  overflow:hidden;

  border-radius:50%;

  background:
    var(--paper);

  border:
    2px solid rgba(255,253,248,.98);

  box-shadow:

    0 6px 16px rgba(53,72,89,.12),

    0 0 0 1px rgba(167,188,166,.18);
}


#mhhm-purchaseTrust .avatars span:not(:first-child){

  margin-right:-11px;
}


#mhhm-purchaseTrust .avatars img{

  display:block;

  width:100%;
  height:100%;

  object-fit:cover;
}


/* =========================================================
   PROOF TEXT
========================================================= */

#mhhm-purchaseTrust .proofText{

  text-align:right;
}


#mhhm-purchaseTrust .proofText strong{

  display:block;

  color:
    var(--navy);

  font-size:.91rem;

  line-height:1.35;

  font-weight:900;
}


#mhhm-purchaseTrust .proofText small{

  display:block;

  margin-top:3px;

  color:
    var(--muted);

  font-size:.68rem;

  line-height:1.4;

  font-weight:500;
}


/* =========================================================
   TRUST ROW
========================================================= */

#mhhm-purchaseTrust .trustRow{

  display:flex;

  align-items:center;

  justify-content:center;

  flex-wrap:wrap;

  gap:
    8px 22px;

  margin-top:12px;
}


/* =========================================================
   TRUST ITEM
========================================================= */

#mhhm-purchaseTrust .trustItem{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  color:
    var(--navy);

  font-size:.74rem;

  line-height:1.4;

  font-weight:800;

  white-space:nowrap;
}


/* =========================================================
   ICON
========================================================= */

#mhhm-purchaseTrust .icon{

  width:29px;
  height:29px;

  flex:
    0 0 29px;

  display:grid;

  place-items:center;

  border-radius:50%;

  color:
    var(--petrol);

  background:

    linear-gradient(
      145deg,
      rgba(221,232,220,.92),
      rgba(234,245,240,.96)
    );

  box-shadow:

    inset 0 0 0 1px
    rgba(167,188,166,.35),

    0 4px 11px
    rgba(53,72,89,.045);
}


/* ACCESS ICON STRONGER */

#mhhm-purchaseTrust
.trustItem.access
.icon{

  color:
    #E8F5F2;

  background:

    linear-gradient(
      145deg,
      var(--petrol-deep),
      var(--petrol)
    );

  box-shadow:

    0 6px 14px rgba(18,60,66,.14),

    inset 0 1px 0
    rgba(255,255,255,.07);
}


#mhhm-purchaseTrust .icon svg{

  width:14px;
  height:14px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.9;

  stroke-linecap:round;

  stroke-linejoin:round;
}


/* =========================================================
   GOLD SEPARATOR
========================================================= */

#mhhm-purchaseTrust .trustDot{

  width:4px;
  height:4px;

  flex:
    0 0 4px;

  border-radius:50%;

  background:
    var(--gold);

  opacity:.72;
}


/* =========================================================
   HOVER
========================================================= */

@media(hover:hover){

  #mhhm-purchaseTrust .trustItem{

    transition:
      transform .22s ease,
      color .22s ease;
  }


  #mhhm-purchaseTrust .trustItem:hover{

    transform:
      translateY(-2px);

    color:
      var(--petrol);
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px){

  #mhhm-purchaseTrust{

    padding:
      8px 12px 23px;
  }


  #mhhm-purchaseTrust .wrap{

    max-width:430px;
  }


  #mhhm-purchaseTrust .proof{

    gap:10px;
  }


  #mhhm-purchaseTrust .avatars span{

    width:31px;
    height:31px;

    flex-basis:31px;
  }


  #mhhm-purchaseTrust
  .avatars span:not(:first-child){

    margin-right:-10px;
  }


  #mhhm-purchaseTrust .proofText strong{

    font-size:.79rem;
  }


  #mhhm-purchaseTrust .proofText small{

    font-size:.61rem;
  }


  #mhhm-purchaseTrust .trustRow{

    margin-top:10px;

    gap:
      7px 12px;
  }


  #mhhm-purchaseTrust .trustItem{

    font-size:.67rem;

    gap:6px;
  }


  #mhhm-purchaseTrust .icon{

    width:26px;
    height:26px;

    flex-basis:26px;
  }


  #mhhm-purchaseTrust .icon svg{

    width:13px;
    height:13px;
  }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:390px){

  #mhhm-purchaseTrust{

    padding:
      7px 9px 20px;
  }


  #mhhm-purchaseTrust .proof{

    gap:8px;
  }


  #mhhm-purchaseTrust .avatars span{

    width:28px;
    height:28px;

    flex-basis:28px;
  }


  #mhhm-purchaseTrust
  .avatars span:not(:first-child){

    margin-right:-9px;
  }


  #mhhm-purchaseTrust .proofText strong{

    font-size:.74rem;
  }


  #mhhm-purchaseTrust .proofText small{

    font-size:.58rem;
  }


  #mhhm-purchaseTrust .trustRow{

    margin-top:9px;

    gap:
      7px 9px;
  }


  #mhhm-purchaseTrust .trustItem{

    font-size:.62rem;
  }


  #mhhm-purchaseTrust .trustDot{

    display:none;
  }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media(max-width:350px){

  #mhhm-purchaseTrust .trustRow{

    flex-direction:column;

    gap:7px;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  #mhhm-purchaseTrust .wrap{

    opacity:1;

    transform:none;

    transition:none;
  }

}
  
  @media(min-width:769px){

  #mhhm-purchaseTrust .avatars span{
    width:29px !important;
    height:29px !important;
    flex-basis:29px !important;
  }

  #mhhm-purchaseTrust .avatars span:not(:first-child){
    margin-right:-9px !important;
  }

  #mhhm-purchaseTrust .proofText strong{
    font-size:.80rem !important;
  }

  #mhhm-purchaseTrust .proofText small{
    font-size:.60rem !important;
  }

  #mhhm-purchaseTrust .trustItem{
    font-size:.66rem !important;
  }

  #mhhm-purchaseTrust .icon{
    width:25px !important;
    height:25px !important;
    flex-basis:25px !important;
  }

  #mhhm-purchaseTrust .icon svg{
    width:12px !important;
    height:12px !important;
  }

  #mhhm-purchaseTrust .trustRow{
    margin-top:9px !important;
  }

}

</style>

<script>

(function(){

  var section =
    document.getElementById(
      'mhhm-purchaseTrust'
    );


  if(!section){
    return;
  }


  var wrap =
    section.querySelector(
      '.wrap'
    );


  if(!wrap){
    return;
  }


  if(

    !(
      'IntersectionObserver'
      in window
    )

    ||

    window
      .matchMedia(
        '(prefers-reduced-motion:reduce)'
      )
      .matches

  ){

    wrap.classList.add(
      'visible'
    );

    return;
  }


  var observer =
    new IntersectionObserver(

      function(entries){

        entries.forEach(
          function(entry){

            if(
              entry.isIntersecting
            ){

              wrap.classList.add(
                'visible'
              );

              observer.disconnect();

            }

          }
        );

      },

      {
        threshold:.16
      }

    );


  observer.observe(
    section
  );

})();

</script>
