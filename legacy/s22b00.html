(function(){


  /* ======================================================
     PREVENT DUPLICATE INITIALIZATION
  ====================================================== */

  if(
    window.__MHH_MANHAJ_STICKY_V8__
  ){
    return;
  }


  window.__MHH_MANHAJ_STICKY_V8__ =
    true;



  function initMhhSticky(){


    var sticky =
      document.querySelector(
        '.mhh-sticky-cta'
      );


    var bar =
      document.querySelector(
        '.mhh-sticky-action-bar'
      );


    if(
      !sticky ||
      !bar
    ){

      return;

    }



    var backTop =
      bar.querySelector(
        '.mhh-back-top'
      );


    var faqLink =
      bar.querySelector(
        '.mhh-float-faq'
      );


    var ticking =
      false;


    var isScrollingToTop =
      false;



    /* =====================================================
       UPDATE
    ====================================================== */

    function update(){


      ticking =
        false;



      var hero =
        document.querySelector(
          '.mhh-hero-section, #mhhm-hero'
        );


      var pricing =
        document.querySelector(
          '.mhh-pricing-section, #mhhm-offer'
        );



      /* HERO PASSED */

      var heroPassed;


      if(hero){

        var heroRect =
          hero.getBoundingClientRect();


        heroPassed =
          heroRect.bottom <= 0;

      }else{

        heroPassed =
          window.scrollY > 650;

      }



      /* PRICING VISIBLE */

      var pricingVisible =
        false;


      if(pricing){

        var pricingRect =
          pricing.getBoundingClientRect();


        pricingVisible =

          pricingRect.top <
            window.innerHeight * .88

          &&

          pricingRect.bottom >
            window.innerHeight * .12;

      }



      /* SHOW ONLY BETWEEN HERO AND PRICING */

      var shouldShow =

        heroPassed

        &&

        !pricingVisible;



      sticky.classList.toggle(
        'mhh-sticky-visible',
        shouldShow
      );



      /* BACK TO TOP — DESKTOP */

      if(backTop){


        var showBackTop =

          shouldShow

          &&

          window.scrollY > 650

          &&

          !isScrollingToTop;


        backTop.classList.toggle(
          'is-visible',
          showBackTop
        );

      }


    }



    /* =====================================================
       REQUEST UPDATE
    ====================================================== */

    function requestUpdate(){


      if(ticking){
        return;
      }


      ticking =
        true;


      requestAnimationFrame(
        update
      );

    }



    /* =====================================================
       BACK TO TOP
    ====================================================== */

    if(backTop){


      backTop.addEventListener(

        'click',

        function(event){


          event.preventDefault();


          isScrollingToTop =
            true;


          backTop.classList.remove(
            'is-visible'
          );


          window.scrollTo({

            top:0,

            behavior:

              window.matchMedia(
                '(prefers-reduced-motion:reduce)'
              ).matches

              ? 'auto'

              : 'smooth'

          });


          window.setTimeout(

            function(){

              isScrollingToTop =
                false;

              requestUpdate();

            },

            900

          );


        }

      );

    }



    /* =====================================================
       FAQ — DESKTOP
    ====================================================== */

    if(faqLink){


      faqLink.addEventListener(

        'click',

        function(event){


          var faq =
            document.getElementById(
              'mhhm-faq'
            );


          if(!faq){
            return;
          }


          event.preventDefault();


          faq.scrollIntoView({

            behavior:

              window.matchMedia(
                '(prefers-reduced-motion:reduce)'
              ).matches

              ? 'auto'

              : 'smooth',

            block:'start'

          });


        }

      );

    }



    /* =====================================================
       EVENTS
    ====================================================== */

    window.addEventListener(

      'scroll',

      requestUpdate,

      {
        passive:true
      }

    );


    window.addEventListener(

      'resize',

      requestUpdate

    );


    window.addEventListener(

      'orientationchange',

      requestUpdate

    );



    /* INITIAL CHECKS */

    update();


    window.setTimeout(
      update,
      250
    );


    window.setTimeout(
      update,
      900
    );


  }



  if(
    document.readyState ===
    'loading'
  ){

    document.addEventListener(
      'DOMContentLoaded',
      initMhhSticky,
      {
        once:true
      }
    );

  }else{

    initMhhSticky();

  }


})();

</script>
