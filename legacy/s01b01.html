    <div class="kicker reveal">

      <span>✦</span>

      <strong>
        من التيه إلى الطمأنينة
      </strong>

      <span>✦</span>

    </div>


  </div>


  <div class="heroBody">


    <h1 class="reveal">

      <span class="heroTitleLine">
        رحلة علمية إيمانية
      </span>

      <span class="heroTitleLine">
        تعيد ترتيب فهمك لنفسك ولحياتك
      </span>

    </h1>


    <p class="subtitle reveal">

      من خلال دراسة عميقة للنفس من منظور إيماني تساعدك تنتقل
      من التشتت والإرهاق الدائم إلى الطمأنينة والهدوء

    </p>
  </div>

</section>



<script>

(function(){

  var section =
    document.getElementById(
      'mhhm-videoIntro'
    );


  if(!section){
    return;
  }


  var items =
    section.querySelectorAll(
      '.reveal'
    );


  if(
    !(
      'IntersectionObserver'
      in window
    )
    ||
    window
      .matchMedia(
        '(prefers-reduced-motion:reduce)'
      )
      .matches
  ){

    items.forEach(
      function(item){

        item.classList.add(
          'visible'
        );

      }
    );

    return;
  }


  var observer =
    new IntersectionObserver(

      function(entries){

        entries.forEach(

          function(entry){

            if(
              entry.isIntersecting
            ){

              var local =
                section.querySelectorAll(
                  '.reveal'
                );


              local.forEach(

                function(
                  item,
                  index
                ){

                  setTimeout(

                    function(){

                      item
                        .classList
                        .add(
                          'visible'
                        );

                    },

                    index * 90

                  );

                }

              );


              observer.disconnect();

            }

          }

        );

      },

      {
        threshold:.10
      }

    );


  observer.observe(
    section
  );

})();

</script>
