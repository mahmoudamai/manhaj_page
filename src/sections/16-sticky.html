<!-- =====================================================================
     16 · STICKY BAR  —  keep it inside your GHL fixed-bottom section.
     Shows after the hero, hides while offer / guarantee are on screen
     (driven by core.js — no script in this block).
     Desktop: price + FAQ + WhatsApp + CTA · Mobile: price + WhatsApp + CTA
     ===================================================================== -->
<div class="mh-sticky" data-mh-sticky>
  <div class="mh-sticky__bar">
    <div class="mh-sticky__info">
      <b>منهج الطمأنينة — عام كامل</b>
      <small><s>9,500</s> وفّر 2,000 جنيه • ضمان 7 أيام</small>
    </div>
    <div class="mh-sticky__actions">
      <a class="mh-sticky__icon mh-sticky__icon--faq" href="#mh-faq" aria-label="الأسئلة الشائعة" title="الأسئلة الشائعة">{{icon:help}}</a>
      <a class="mh-sticky__icon mh-sticky__icon--wa" href="{{whatsapp}}" target="_blank" rel="noopener" aria-label="تواصل واتساب" title="تواصل واتساب">{{icon:whatsapp}}</a>
      <a class="mh-btn" href="{{checkout}}">
        ابدأ بـ 7,500 جنيه
        <span class="mh-btn__arrow">{{icon:arrow}}</span>
      </a>
    </div>
  </div>
</div>
