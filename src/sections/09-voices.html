     09 · VOICES  —  all social proof in one place

<section class="mh mh-voices" id="mh-voices">
  <div class="mh-wrap">

    <div class="mh-head mh-center">
      <p class="mh-eyebrow" data-reveal><b>٠٨</b><i></i>بكلماتهم<i></i></p>
      <h2 class="mh-h2" data-reveal>ماذا قال أعضاء المنهج عن <em>تجربتهم</em>؟</h2>
    </div>

    <figure class="mh-feature" data-reveal>
      <svg class="mh-quote__mark" viewBox="0 0 48 38" fill="currentColor" aria-hidden="true"><path d="M20 0v8c-6 1.5-9 5.5-9.5 11H20v19H0V20C0 8 7 1 20 0Zm28 0v8c-6 1.5-9 5.5-9.5 11H48v19H28V20C28 8 35 1 48 0Z"/></svg>
      <blockquote class="mh-quote mh-quote--xl">
        تجربة عميقة هادئة، كإن حد بيشيل التراب عن الطريق؛
        عشان تشوف بوضوح، وتفكر بعمق، وتحلل بشكل منطقي وواقعي.
      </blockquote>
      <figcaption class="mh-cite"><b>إيمان أحمد فؤاد</b></figcaption>
    </figure>

    <div class="mh-wall" data-reveal-group>
      <figure class="mh-card mh-says">
        <p>المرجع الديني بجد من أكتر الحاجات اللي كنت بتمنى تبقى موجودة في المحتوى اللي زي كدا؛ كان دايمًا الأغلب بيتكلم عن نظريات أشخاص، والنظريات بتبقى وجهة نظر وبتتغير مع الوقت… لكن لما يبقى جاي من الوحي بيبقى حاجة مختلفة.</p>
        <footer><span class="mh-av">ع</span><span>عبد الرحمن</span></footer>
      </figure>
      <figure class="mh-card mh-says">
        <p>منهج هيساعدك بأسلوب هادئ وسلس إنك تغيّر أفكارك عشان تقرب من ربنا أكتر وترتاح في حياتك. وأسلوب وشخصية الأستاذ كريم ليهم دور كبير في إن الواحد يتقبل الكلام بسهولة.</p>
        <footer><span class="mh-av">م</span><span>مي إسحاق</span></footer>
      </figure>
      <figure class="mh-card mh-says">
        <p>منهج يجمع بين العلم والدين، والطمأنينة واضحة في دفء الجلسة وتودّد الكوتش والكلام الطيب المريح المستند إلى القرآن والسنة.</p>
        <footer><span class="mh-av">هـ</span><span>هنا حسن علي</span></footer>
      </figure>
      <figure class="mh-card mh-says">
        <p>في حاجات بنبقى مش فاهمين سببها أو أصلها، وبيطلع السبب بتاعها تيه النفس وشتاتها. والمنهج ده من وجهة نظري بيساعدنا نفهم نفسنا ونكون أهدى وأوعى.</p>
        <footer><span class="mh-av">س</span><span>سارة عمرو</span></footer>
      </figure>
      <figure class="mh-card mh-says">
        <p>صدق الحديث… والمنهج عبارة عن مرشد روحي ياخد بإيدك للغوص داخل نفسك، وإعادة اكتشاف مفاهيم غايبة عن بالنا، ونشوف الواقع بنظرة مختلفة.</p>
        <footer><span class="mh-av">س</span><span>سامية عثمان</span></footer>
      </figure>
      <figure class="mh-card mh-says">
        <p>إنها رحلة تربوية إيمانية عميقة، مع مشاركة علم النفس في تفاصيلها.</p>
        <footer><span class="mh-av">ح</span><span>حازم أبو ريان</span></footer>
      </figure>
    </div>
