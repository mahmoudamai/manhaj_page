/* =====================================================================
   M4 · MAIN CSS — منهج الطمأنينة
   ---------------------------------------------------------------------
   Everything the page looks like is controlled from the THEME CONTROLS
   below. Sections never hard-code colours, fonts or speeds; they read
   these tokens. Change a value here → the whole page follows.

   Naming:  #m4-<section>            one id per GHL block
            .m4-<section>__<part>    elements inside that block
            .m4-<primitive>          shared building blocks (optional)
            .is-open / .is-visible   states set by Block 00B
   ===================================================================== */


/* =====================================================================
   1 · THEME CONTROLS  ← edit here
   ===================================================================== */
:root {

  /* ---------- brand colours ---------- */
  --m4-primary:          #1E5960;   /* petrol — main brand colour           */
  --m4-primary-deep:     #123C42;   /* dark petrol — dark sections, text    */
  --m4-primary-alt:      #294E63;   /* blue-petrol — gradients              */
  --m4-ink:              #354859;   /* navy — headings on light             */
  --m4-secondary:        #A7BCA6;   /* sage                                 */
  --m4-secondary-soft:   #DDE8DC;   /* light sage                           */
  --m4-highlight:        #8EC9C4;   /* teal                                 */
  --m4-highlight-soft:   #A9DED8;   /* bright teal                          */
  --m4-accent:           #D3B267;   /* gold — accents, prices, CTA          */
  --m4-accent-soft:      #E9D8A8;   /* light gold                           */
  --m4-accent-deep:      #90794C;   /* dark gold — small gold text on light */
  --m4-olive:            #3C5141;   /* olive (section 15 image card)        */

  /* ---------- backgrounds ---------- */
  --m4-bg-paper:         #FFFDF8;
  --m4-bg-ivory:         #FBF7EF;
  --m4-bg-cream:         #F7F3EA;
  --m4-bg-cloud:         #EEF3F1;

  /* ---------- text ---------- */
  --m4-text:             #5D6A70;
  --m4-text-muted:       #748086;

  /* ---------- neutrals & utility (rarely changed) ---------- */
  --m4-white:            #FFFFFF;
  --m4-black:            #000000;
  --m4-live:             #FF3B30;   /* "live" dot                           */
  --m4-alert:            #E75C4D;   /* coral — "not for you", pulses        */
  --m4-telegram:         #2AABEE;
  --m4-whatsapp:         #25D366;

  /* ---------- CTA buttons (offer "ابدأ رحلتك الآن" + sticky checkout) ---------- */
  --m4-cta-bg:           #FF3B30;   /* the current red                      */
  --m4-cta-text:         #FFFFFF;

  /* ---------- typography ----------
     primary : body text, UI, numbers
     heading : section titles (defaults to primary — set to display for an editorial look)
     display : quotes, testimonials, emotional one-liners
     Other good pairs:  "Tajawal" · "Alexandria" · "Readex Pro"  /  "Markazi Text" · "Noto Naskh Arabic"
     (load any new family in the <link> at the top of Block 00) */
  --m4-font-primary:     "IBM Plex Sans Arabic", "Tajawal", system-ui, -apple-system, "Segoe UI", sans-serif;
  --m4-font-heading:     var(--m4-font-primary);
  --m4-font-display:     "Amiri", "Noto Naskh Arabic", serif;

  --m4-type-scale:       1;         /* all body/UI text sizes     (0.9 – 1.15) */
  --m4-heading-scale:    1;         /* all headings & big numbers (0.85 – 1.2) */

  /* ---------- spacing & shape ---------- */
  --m4-space-scale:      1;         /* section top/bottom padding (0.75 – 1.25) */
  --m4-radius-scale:     1;         /* every rounded corner (0 = sharp, 1.5 = softer) */
  --m4-container:        1180px;    /* width used by .m4-container */
  --m4-gutter:           clamp(18px, 4vw, 40px);

  /* ---------- shadows (used by the shared primitives) ---------- */
  --m4-shadow-sm:        0 1px 2px color-mix(in srgb, var(--m4-ink) 8%, transparent), 0 6px 18px color-mix(in srgb, var(--m4-ink) 6%, transparent);
  --m4-shadow-md:        0 2px 6px color-mix(in srgb, var(--m4-ink) 6%, transparent), 0 18px 44px color-mix(in srgb, var(--m4-ink) 10%, transparent);
  --m4-shadow-lg:        0 4px 10px color-mix(in srgb, var(--m4-ink) 6%, transparent), 0 30px 70px color-mix(in srgb, var(--m4-ink) 14%, transparent);

  /* ---------- motion ---------- */
  --m4-motion-scale:     1;         /* every hover/transition speed (0 = off, 1.3 = slower) */
  --m4-ease:             cubic-bezier(.22, .72, .2, 1);
  --m4-ease-out:         cubic-bezier(.16, 1, .3, 1);
  --m4-reveal-duration:  .85s;      /* scroll entrance */
  --m4-reveal-distance:  18px;
  --m4-reveal-stagger:   70ms;
}


/* =====================================================================
   2 · SHARED PRIMITIVES
   All wrapped in :where() → zero specificity, so a section's own styles
   always win. Use them for anything new; existing sections keep their
   own personality on top.
   ===================================================================== */
:where(.m4-section) {
  direction: rtl;
  font-family: var(--m4-font-primary);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

:where(.m4-container) {
  width: 100%;
  max-width: calc(var(--m4-container) + var(--m4-gutter) * 2);
  margin-inline: auto;
  padding-inline: var(--m4-gutter);
}

:where(.m4-kicker) {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--m4-primary);
  font-size: calc(14px * var(--m4-type-scale));
  font-weight: 700;
}

:where(.m4-heading) {
  margin: 0;
  color: var(--m4-primary-deep);
  font-family: var(--m4-font-heading);
  font-size: calc(clamp(28px, 20px + 2.4vw, 46px) * var(--m4-heading-scale));
  font-weight: 800;
  line-height: 1.35;
  text-wrap: balance;
}

:where(.m4-display) {
  font-family: var(--m4-font-display);
}

:where(.m4-card) {
  background: var(--m4-bg-paper);
  border: 1px solid color-mix(in srgb, var(--m4-primary) 10%, transparent);
  border-radius: calc(20px * var(--m4-radius-scale));
  box-shadow: var(--m4-shadow-sm);
}

:where(.m4-btn) {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 54px;
  padding: 0 26px;
  border: 0;
  border-radius: calc(14px * var(--m4-radius-scale));
  font-family: var(--m4-font-primary);
  font-size: calc(16px * var(--m4-type-scale));
  font-weight: 800;
  text-decoration: none;
  cursor: pointer;
  transition: transform calc(.25s * var(--m4-motion-scale)) var(--m4-ease),
              box-shadow calc(.25s * var(--m4-motion-scale)) var(--m4-ease);
}

:where(.m4-btn-primary) {
  background: var(--m4-cta-bg);
  color: var(--m4-cta-text);
  box-shadow: 0 12px 28px color-mix(in srgb, var(--m4-cta-bg) 28%, transparent);
}

:where(.m4-btn:hover) {
  transform: translateY(-2px);
}


/* =====================================================================
   3 · MOTION SYSTEM  (progressive enhancement)
   ---------------------------------------------------------------------
   · Content is ALWAYS visible by default: no JS, GHL editor/preview,
     reduced motion → nothing is ever hidden.
   · Block 00B adds .m4-motion to <html> on the live page only, then
     "arms" .m4-reveal elements that are still BELOW the screen and plays
     a soft rise-in the moment they scroll into view. Anything already on
     screen is never touched.
   · Uses the independent `translate` property, so it never fights a
     section's own transform / hover effects.
   ===================================================================== */
@keyframes m4-reveal-in {
  from { opacity: 0; translate: 0 var(--m4-reveal-distance); }
  to   { opacity: 1; translate: 0 0; }
}

.m4-motion .m4-reveal.is-armed {
  opacity: 0 !important;   /* beats each section's own "final" opacity until it scrolls in */
}

.m4-motion .m4-reveal.is-revealed {
  animation: m4-reveal-in calc(var(--m4-reveal-duration) * var(--m4-motion-scale)) var(--m4-ease-out) both;
  animation-delay: calc(var(--m4-i, 0) * var(--m4-reveal-stagger));
}

@media (prefers-reduced-motion: reduce) {
  .m4-motion .m4-reveal.is-armed { opacity: 1 !important; }
  .m4-motion .m4-reveal.is-revealed { animation: none; }
}


/* =====================================================================
   4 · SECTIONS
   Each block below is scoped to its own #m4-<section> id, so nothing
   leaks into GHL forms, menus or checkout elements.
   ===================================================================== */
