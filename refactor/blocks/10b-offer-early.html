<!-- =====================================================================
     M4 · BLOCK 10B — Early price (v3: a clear "price moment")
     A dark card in the colours of the main offer's price card: what the
     subscription includes on one side, the price and the button on the other.
     Place it right after Block 10 (Yusuf), before Block 11 (lectures).
     Section styles are scoped to #m4-offer-early. Colours, fonts, sizes and
     speeds come from Block 00 — edit the theme there, not here.
     Keep the price, old price and checkout link in sync with Blocks 03 and 21.
     ===================================================================== -->
<style>
#m4-offer-early {
  position: relative;
  direction: rtl;
  text-align: right;
  font-family: var(--m4-font-primary) !important;
  color: var(--m4-ink);
  padding: calc(64px * var(--m4-space-scale)) calc(22px * var(--m4-space-scale));
  background:
    radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--m4-accent) 10%, transparent), transparent 45%),
    linear-gradient(180deg, var(--m4-bg-cream) 0%, var(--m4-bg-ivory) 100%);
}

#m4-offer-early *,
#m4-offer-early *::before,
#m4-offer-early *::after {
  box-sizing: border-box;
}

#m4-offer-early .m4-offer-early__card {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  max-width: 1040px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  border-radius: calc(28px * var(--m4-radius-scale));
  border: 1px solid color-mix(in srgb, var(--m4-white) 10%, transparent);
  background:
    radial-gradient(circle at 12% 14%, color-mix(in srgb, var(--m4-accent) 16%, transparent), transparent 32%),
    radial-gradient(circle at 92% 90%, color-mix(in srgb, var(--m4-highlight-soft) 9%, transparent), transparent 30%),
    linear-gradient(135deg, color-mix(in srgb, var(--m4-primary) 54%, var(--m4-black)) 0%, var(--m4-primary-deep) 50%, color-mix(in srgb, var(--m4-primary) 91%, var(--m4-black)) 100%);
  box-shadow: 0 28px 64px -18px color-mix(in srgb, var(--m4-primary-deep) 45%, transparent);
  color: var(--m4-white);
}

/* faint gold ring, echoing the page's ornaments */
#m4-offer-early .m4-offer-early__card::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: 420px;
  height: 420px;
  left: -140px;
  top: -210px;
  border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--m4-accent) 22%, transparent);
  box-shadow: 0 0 0 40px color-mix(in srgb, var(--m4-accent) 3%, transparent);
}

/* ---- right: what the subscription includes ---- */
#m4-offer-early .m4-offer-early__includes {
  padding: 38px 40px 36px;
}

#m4-offer-early .m4-offer-early__kicker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--m4-accent);
  font-size: calc(.8rem * var(--m4-type-scale));
  font-weight: 800;
}

#m4-offer-early .m4-offer-early__kicker::before {
  content: "";
  width: 20px;
  height: 1px;
  background: var(--m4-accent);
}

#m4-offer-early h2 {
  margin: 10px 0 0;
  color: var(--m4-white);
  font-size: calc(clamp(1.5rem, 1.1rem + 1.3vw, 2.1rem) * var(--m4-heading-scale));
  line-height: 1.45;
  font-weight: 800;
}

#m4-offer-early h2 em {
  font-style: normal;
  color: var(--m4-accent);
}

#m4-offer-early .m4-offer-early__list {
  margin: 22px 0 0;
  padding: 0;
  list-style: none;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px 16px;
}

#m4-offer-early .m4-offer-early__list li {
  display: flex;
  align-items: center;
  gap: 10px;
  color: color-mix(in srgb, var(--m4-white) 88%, transparent);
  font-size: calc(.88rem * var(--m4-type-scale));
  line-height: 1.5;
  font-weight: 600;
}

#m4-offer-early .m4-offer-early__list i {
  flex: 0 0 36px;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 11px;
  color: var(--m4-accent);
  background: color-mix(in srgb, var(--m4-white) 7%, transparent);
  border: 1px solid color-mix(in srgb, var(--m4-accent) 28%, transparent);
}

#m4-offer-early .m4-offer-early__list svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#m4-offer-early .m4-offer-early__details {
  display: inline-block;
  margin-top: 22px;
  color: color-mix(in srgb, var(--m4-white) 72%, transparent);
  font-size: calc(.82rem * var(--m4-type-scale));
  font-weight: 600;
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--m4-accent) 60%, transparent);
  text-underline-offset: 5px;
}

/* ---- left: the price ---- */
#m4-offer-early .m4-offer-early__deal {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 34px 36px;
  text-align: center;
  border-right: 1px solid color-mix(in srgb, var(--m4-white) 10%, transparent);
  background: color-mix(in srgb, var(--m4-black) 12%, transparent);
}

#m4-offer-early .m4-offer-early__label {
  color: color-mix(in srgb, var(--m4-white) 70%, transparent);
  font-size: calc(.8rem * var(--m4-type-scale));
  font-weight: 700;
}

#m4-offer-early .m4-offer-early__price {
  margin-top: 6px;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
  line-height: 1;
}

#m4-offer-early .m4-offer-early__price strong {
  color: var(--m4-white);
  font-size: calc(3.5rem * var(--m4-heading-scale));
  font-weight: 900;
  letter-spacing: -.02em;
}

#m4-offer-early .m4-offer-early__price span {
  color: var(--m4-accent);
  font-size: calc(1.05rem * var(--m4-type-scale));
  font-weight: 800;
}

#m4-offer-early .m4-offer-early__was {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 10px;
  margin-top: 14px;
  color: color-mix(in srgb, var(--m4-white) 70%, transparent);
  font-size: calc(.86rem * var(--m4-type-scale));
}

#m4-offer-early .m4-offer-early__was del {
  color: color-mix(in srgb, var(--m4-white) 70%, transparent);
  text-decoration-color: var(--m4-alert);
  text-decoration-thickness: 2px;
}

/* the saving in green, like under the hero button (lighter green on dark) */
#m4-offer-early .m4-offer-early__was b {
  padding: 3px 11px;
  border-radius: 999px;
  color: color-mix(in srgb, var(--m4-success, #177A4E) 35%, var(--m4-white));
  background: color-mix(in srgb, var(--m4-success, #177A4E) 32%, transparent);
  font-weight: 800;
}

#m4-offer-early .m4-offer-early__cta {
  width: 100%;
  max-width: 320px;
  margin-top: 20px;
  padding: 15px 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid var(--m4-cta-bg);
  border-radius: calc(15px * var(--m4-radius-scale));
  background: var(--m4-cta-bg);
  color: var(--m4-cta-text);
  font-family: var(--m4-font-primary);
  font-size: calc(1rem * var(--m4-type-scale));
  line-height: 1.5;
  font-weight: 900;
  text-decoration: none;
  box-shadow: 0 14px 30px color-mix(in srgb, var(--m4-cta-bg) 30%, transparent);
  transition: transform calc(.2s * var(--m4-motion-scale)) var(--m4-ease), box-shadow calc(.2s * var(--m4-motion-scale)) var(--m4-ease);
}

#m4-offer-early .m4-offer-early__cta svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#m4-offer-early .m4-offer-early__guarantee {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 13px;
  color: color-mix(in srgb, var(--m4-white) 76%, transparent);
  font-size: calc(.8rem * var(--m4-type-scale));
  font-weight: 600;
}

#m4-offer-early .m4-offer-early__guarantee svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: var(--m4-accent);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

@media (hover: hover) {
  #m4-offer-early .m4-offer-early__cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 36px color-mix(in srgb, var(--m4-cta-bg) 38%, transparent);
  }
}

/* phones: the price first, then what's included */
@media (max-width: 820px) {
  #m4-offer-early {
    padding: calc(44px * var(--m4-space-scale)) calc(14px * var(--m4-space-scale));
  }

  #m4-offer-early .m4-offer-early__card {
    grid-template-columns: 1fr;
    border-radius: calc(22px * var(--m4-radius-scale));
  }

  #m4-offer-early .m4-offer-early__deal {
    order: -1;
    padding: 28px 20px 26px;
    border-right: 0;
    border-bottom: 1px solid color-mix(in srgb, var(--m4-white) 10%, transparent);
  }

  #m4-offer-early .m4-offer-early__price strong {
    font-size: calc(3rem * var(--m4-heading-scale));
  }

  #m4-offer-early .m4-offer-early__includes {
    padding: 24px 20px 26px;
    text-align: center;
  }

  #m4-offer-early .m4-offer-early__kicker::before {
    display: none;
  }

  #m4-offer-early h2 {
    font-size: calc(1.3rem * var(--m4-heading-scale));
  }

  #m4-offer-early .m4-offer-early__list {
    margin-top: 16px;
    gap: 10px;
    text-align: right;
  }

  #m4-offer-early .m4-offer-early__list li {
    flex-direction: column;
    gap: 6px;
    padding: 12px 8px;
    border-radius: 14px;
    text-align: center;
    background: color-mix(in srgb, var(--m4-white) 5%, transparent);
    font-size: calc(.8rem * var(--m4-type-scale));
  }
}

/* self-check: this block is the current version */
#m4-offer-early {
  --m4-styled: 10;
}
</style>
