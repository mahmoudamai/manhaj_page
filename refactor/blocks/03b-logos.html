<!-- =====================================================================
     M4 · BLOCK 03B — Logos strip (replaces the GHL logos marquee element)
     Sits at the bottom of the hero (inside the GHL hero section, after
     Block 03), on the hero's own background — no separate band.
     · every logo is shown at the same visual height and in one muted tone
       (full colour on hover), so a big logo can't dominate the row
     · slow continuous scroll with faded edges; pauses on hover; stands
       still (and wraps) for visitors who turned motion off
     Each logo sits in a <span> sized to the logo's own drawing (not the
     image's empty margins): --w/--h = visible size in px, --iw/--ih = the
     full image size, --x/--y = how far the empty margin is shifted out.
     Sizes follow the logo's shape (wide logos lower, square ones taller)
     so they all look about equally big.
     To add a logo: copy a line and set --w/--h (e.g. --w:90;--h:28 for a
     wide logo, --w:50;--h:44 for a square one) with --iw/--ih the same and
     --x/--y 0 — then add the same line (alt="") to the second set, which
     only repeats the first so the loop is seamless.
     Section styles are scoped to #m4-logos. Colours, fonts, sizes and
     speeds come from Block 00 — edit the theme there, not here.
     ===================================================================== -->
<style>
#m4-logos {
  direction: rtl;
  font-family: var(--m4-font-primary) !important;
  padding: calc(14px * var(--m4-space-scale)) 0 calc(34px * var(--m4-space-scale));
  background: transparent;
  --s: 1;
}

#m4-logos *,
#m4-logos *::before,
#m4-logos *::after {
  box-sizing: border-box;
}

#m4-logos .m4-logos__wrap {
  max-width: 1160px;
  margin: 0 auto;
  padding: 0 20px;
}

#m4-logos .m4-logos__viewport {
  overflow: hidden;
  direction: ltr;
  padding: 6px 0;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10%, #000 90%, transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 10%, #000 90%, transparent 100%);
}

#m4-logos .m4-logos__track {
  display: flex;
  width: max-content;
  /* the moving track is its own layer, so the logos' white backgrounds can
     only "multiply" away against a colour on it: the hero's bottom tone */
  background: var(--m4-bg-cream);
  animation: m4-logos-scroll calc(95s * var(--m4-motion-scale)) linear infinite;
}

#m4-logos .m4-logos__viewport:hover .m4-logos__track {
  animation-play-state: paused;
}

#m4-logos .m4-logos__set {
  display: flex;
  align-items: center;
  gap: calc(58px * var(--s));
  padding-right: calc(58px * var(--s));
}

/* the visible part of each logo (the image's empty margins are cut off) */
#m4-logos .m4-logos__set > span {
  flex: 0 0 auto;
  display: block;
  width: calc(var(--w) * 1px * var(--s));
  height: calc(var(--h) * 1px * var(--s));
  overflow: hidden;
}

#m4-logos .m4-logos__set img {
  display: block;
  width: calc(var(--iw) * 1px * var(--s)) !important;
  height: calc(var(--ih) * 1px * var(--s)) !important;
  max-width: none !important;
  margin: calc(var(--y) * 1px * var(--s)) 0 0 calc(var(--x) * 1px * var(--s));
  object-fit: fill;
  /* one quiet tone for all logos; full colour on hover */
  filter: grayscale(1) contrast(1.25);
  opacity: .6;
  mix-blend-mode: multiply;
  transition: filter calc(.3s * var(--m4-motion-scale)) var(--m4-ease), opacity calc(.3s * var(--m4-motion-scale)) var(--m4-ease);
}

/* a logo printed on a solid colour block: inverted so the block turns
   white (and disappears) and the lettering turns dark */
#m4-logos .m4-logos__set > .is-block img {
  filter: grayscale(1) invert(1) contrast(2.2) brightness(1.15);
}

#m4-logos .m4-logos__set > span:hover img {
  filter: none;
  opacity: 1;
}

@keyframes m4-logos-scroll {
  to { transform: translateX(-50%); }
}

@media (max-width: 680px) {
  #m4-logos {
    --s: .74;
    padding: calc(8px * var(--m4-space-scale)) 0 calc(26px * var(--m4-space-scale));
  }

  #m4-logos .m4-logos__wrap {
    padding: 0;
  }
}

/* motion off: no scrolling — a centred, wrapping grid of the logos */
@media (prefers-reduced-motion: reduce) {
  #m4-logos .m4-logos__viewport {
    -webkit-mask-image: none;
            mask-image: none;
  }

  #m4-logos .m4-logos__track {
    width: auto;
    animation: none;
    justify-content: center;
  }

  #m4-logos .m4-logos__set {
    flex-wrap: wrap;
    justify-content: center;
    gap: 22px 40px;
    padding: 0;
  }

  #m4-logos .m4-logos__set[aria-hidden="true"] {
    display: none;
  }
}

/* self-check: this block is the current version */
#m4-logos {
  --m4-styled: 3;
}
</style>
