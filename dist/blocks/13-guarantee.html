     13 · GUARANTEE  —  compact seal, right after the price (old 20)
     ===================================================================== -->
<section class="mh mh-guarantee mh--tight" id="mh-guarantee" data-mh-hide-sticky>
  <div class="mh-wrap">
    <div class="mh-card mh-guarantee__box" data-reveal>

      <div class="mh-seal" aria-hidden="true">
        <svg class="mh-seal__ring" viewBox="0 0 200 200">

      <div>

        </p>

          <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg> استرداد 100%</span>
          <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-width="2.2"><path d="m5 12.5 4.5 4.5L19 7"/></svg> دون تبرير</span>
